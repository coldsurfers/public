# Git hooks (lefthook). `pnpm install` 이 .git/hooks 에 설치합니다.
# 커밋 우회(--no-verify)는 금지.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,json,jsonc,css}'
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    biome-ci:
      run: pnpm biome ci .
    check-type:
      run: pnpm turbo check:type
