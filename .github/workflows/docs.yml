name: Docs

# 문서 사이트를 Cloudflare Workers 정적 자산으로 올린다.
#
# 산출은 `next build` 의 `out/` 한 덩어리다 — 서버 런타임이 없으므로 OpenNext 도, Node 도
# 런타임에 필요 없다. 검색 인덱스(`/api/search`)까지 빌드 산출물이라 그대로 실린다.
#
# 필요한 시크릿 둘:
#   CLOUDFLARE_API_TOKEN   — Workers Scripts:Edit 권한
#   CLOUDFLARE_ACCOUNT_ID
# 없으면 배포 스텝을 건너뛴다(빌드는 그대로 돈다) — 시크릿 미설정 상태에서 CI 를 빨갛게
# 만들지 않기 위해서다.
#
# 트리거는 수동 하나다. 문서는 릴리스와 붙는 산출물이 아니라 사람이 "지금 올린다" 고 정할 때
# 올리는 것이라, main 푸시마다 자동으로 배포되지 않는다.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'coldsurfers/public'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `^build` 로 design-system 의 `dist` 가 먼저 선다 — 문서는 소스가 아니라 **발행되는
      # 산출물** 을 물기 때문이다. exports 맵에 없는 경로는 여기서 빌드가 깨진다.
      - name: 문서 빌드
        run: pnpm --filter @coldsurfers/docs... build

      - name: 가드 — Cloudflare 자격 확인
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없다 — 배포를 건너뛴다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare 배포
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
