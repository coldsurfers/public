name: Docs

# 문서 사이트를 Cloudflare Workers 정적 자산으로 올린다.
#
# 산출은 `next build` 의 `out/` 한 덩어리다 — 서버 런타임이 없으므로 OpenNext 도, Node 도
# 런타임에 필요 없다. 검색 인덱스(`/api/search`)까지 빌드 산출물이라 그대로 실린다.
#
# 필요한 시크릿 둘:
#   CLOUDFLARE_API_TOKEN   — Account:Workers Scripts:Edit
#                            + Zone:Workers Routes:Edit   ← 커스텀 도메인이 이걸 친다
#                            + Zone:DNS:Edit              ← 레코드 생성
#                            Zone Resources 에 `coldsurf.io` 가 들어 있어야 한다.
#                            Workers Routes 가 없으면 자산은 올라가고 도메인 붙이는
#                            `/zones/<id>/workers/routes` 에서 code 10000 으로 죽는다.
#   CLOUDFLARE_ACCOUNT_ID
# 하나라도 없으면 **실패한다.** 트리거가 수동 하나뿐이라 이 워크플로가 도는 건 사람이
# "지금 올린다" 고 누른 것뿐이고, 그때 조용히 건너뛰고 초록불을 주면 올라간 줄 알게 된다.
#
# 트리거는 수동 하나다. 문서는 릴리스와 붙는 산출물이 아니라 사람이 정할 때 올리는 것이라,
# main 푸시마다 자동으로 배포되지 않는다.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'coldsurfers/public'
    runs-on: ubuntu-latest

    steps:
      # 빌드보다 먼저 본다. 자격이 없으면 1분 굽고 나서 죽을 이유가 없다.
      - name: 가드 — Cloudflare 자격 확인
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::시크릿이 없다:$missing — Settings → Secrets → Actions 에 넣고 다시 돌린다."
            echo "토큰 권한: Workers Scripts:Edit + Zone:Workers Routes:Edit + Zone:DNS:Edit"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `^build` 로 design-system 의 `dist` 가 먼저 선다 — 문서는 소스가 아니라 **발행되는
      # 산출물** 을 물기 때문이다. exports 맵에 없는 경로는 여기서 빌드가 깨진다.
      # `NEXT_PUBLIC_SITE_URL` 은 sitemap 의 `<loc>` 이 된다 — 상대 경로로는 sitemap 을 못 쓴다.
      # 안 넣으면 `lib/shared.ts` 의 기본값이 실린다.
      - name: 문서 빌드
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.DOCS_SITE_URL }}
        run: pnpm --filter @coldsurfers/docs... build

      # `wranglerVersion` 을 주지 않는다 — 액션은 이미 설치된 wrangler 를 그대로 쓴다.
      # 위 `pnpm install --frozen-lockfile` 이 락파일의 버전을 깔았으므로 로컬과 같은 것이 돈다.
      - name: Cloudflare 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
