name: Alpha Release

# 머지 전에 실제 레지스트리로 물려 보고 싶을 때 쓴다.
#
# changesets 의 **snapshot 릴리스**다 — 버전이 `0.0.0-<tag>-<타임스탬프>` 로 매겨지고
# dist-tag 도 `latest` 가 아닌 `alpha` 로 나간다. 그래서 이걸 아무리 돌려도 `latest` 를
# 물고 있는 소비처(paul-rockstar 앱 셋)는 아무 영향을 받지 않는다.
#
# 실행: Actions → Alpha Release → Run workflow → **브랜치를 골라서** 실행.
# 고른 브랜치의 `.changeset/*.md` 가 대상이므로, changeset 이 없으면 아무것도 안 나간다(아래 가드).
#
# 정식 발행은 `release.yml`(main push → version PR → publish) 이고 이 워크플로는 그 축을
# 건드리지 않는다. 버전 커밋·태그도 남기지 않는다(`--no-git-tag`, config 의 `commit: false`).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'dist-tag (기본 alpha). latest 는 거부된다'
        required: false
        default: alpha

permissions:
  contents: read
  packages: write

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alpha:
    if: github.repository == 'coldsurfers/public'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@coldsurfers'

      # 입력을 셸에 직접 보간하지 않는다 — env 로 받아 인용부호 안에서만 쓴다.
      - name: 가드 — dist-tag 와 changeset 존재 확인
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            echo "::error::dist-tag 가 '$TAG' 다. latest 로는 발행하지 않는다 — 정식 릴리스는 release.yml 의 몫이다."
            exit 1
          fi
          count="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')"
          if [ "$count" -eq 0 ]; then
            echo "::error::이 브랜치에 changeset 이 없다. snapshot 은 changeset 이 가리키는 패키지만 발행하므로 아무것도 나가지 않는다."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: 스냅샷 버전 매기기
        env:
          TAG: ${{ inputs.tag }}
        run: pnpm changeset version --snapshot "$TAG"

      - name: 빌드 · 발행
        env:
          TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pnpm build
          pnpm changeset publish --tag "$TAG" --no-git-tag

      - name: 요약
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Alpha 발행 (\`$TAG\`)"
            echo ""
            echo "| 패키지 | 버전 |"
            echo "| --- | --- |"
            for pkg in packages/*/package.json; do
              node -p "const j = require('./$pkg'); j.private ? '' : '| ' + j.name + ' | ' + j.version + ' |'" | grep '^|' || true
            done
            echo ""
            echo "설치: pnpm add @coldsurfers/design-system@$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
